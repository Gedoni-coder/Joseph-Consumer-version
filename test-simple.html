<!DOCTYPE html>
<html>
<head>
  <title>Simple Test</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; }
    #result { margin-top: 20px; padding: 10px; background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Simple Click Test</h1>
  <p>If buttons work below, then browser/JavaScript is fine.</p>

  <button onclick="document.getElementById('result').innerHTML = '✅ Button 1 works!'">Button 1 (onclick)</button>
  <button id="btn2">Button 2 (addEventListener)</button>

  <div id="result">Click a button...</div>

  <script>
    console.log('Script loaded');

    document.getElementById('btn2').addEventListener('click', function() {
      console.log('Button 2 clicked');
      document.getElementById('result').innerHTML = '✅ Button 2 works!';
    });

    console.log('Event listener attached');
  </script>
</body>
</html>
